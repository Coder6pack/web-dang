<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" width="100%" height="100%">
  <defs>
    <linearGradient id="lotusPinkGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#f8a5c2" />
      <stop offset="85%" stop-color="#e84393" />
      <stop offset="100%" stop-color="#d63031" />
    </linearGradient>
    <linearGradient id="lotusGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5c0" />
      <stop offset="60%" stop-color="#f5cd79" />
      <stop offset="100%" stop-color="#e17055" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#55efc4" />
      <stop offset="100%" stop-color="#00b894" />
    </linearGradient>
    <filter id="glowPink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(0, 10)">
    <!-- Lá sen dưới (Lotus leaves) -->
    <path d="M 20 120 C 60 145 140 145 180 120 C 150 140 50 140 20 120 Z" fill="url(#leafGrad)" opacity="0.8" />
    <path d="M 50 128 C 80 142 120 142 150 128 C 130 138 70 138 50 128 Z" fill="#006266" />

    <!-- Cánh sen ngoài cùng bên trái & phải (Outer petals) -->
    <path d="M 100 120 C 50 115 15 95 18 65 C 20 45 45 40 65 65 C 80 85 95 110 100 120 Z" fill="url(#lotusPinkGrad)" opacity="0.85" stroke="#f5cd79" stroke-width="0.8" />
    <path d="M 100 120 C 150 115 185 95 182 65 C 180 45 155 40 135 65 C 120 85 105 110 100 120 Z" fill="url(#lotusPinkGrad)" opacity="0.85" stroke="#f5cd79" stroke-width="0.8" />

    <!-- Cánh sen tầng trung (Mid petals) -->
    <path d="M 100 122 C 60 110 35 80 45 45 C 55 25 75 35 85 65 C 92 88 98 112 100 122 Z" fill="url(#lotusPinkGrad)" opacity="0.9" stroke="#f5cd79" stroke-width="0.8" />
    <path d="M 100 122 C 140 110 165 80 155 45 C 145 25 125 35 115 65 C 108 88 102 112 100 122 Z" fill="url(#lotusPinkGrad)" opacity="0.9" stroke="#f5cd79" stroke-width="0.8" />

    <!-- Cánh sen trung tâm (Center petals) -->
    <path d="M 100 125 C 75 105 60 65 75 30 C 85 10 98 18 100 45 C 102 18 115 10 125 30 C 140 65 125 105 100 125 Z" fill="url(#lotusPinkGrad)" stroke="#ffde59" stroke-width="1.2" />

    <!-- Búp sen vàng chính giữa (Lotus bud heart) -->
    <path d="M 100 124 C 88 95 85 55 100 22 C 115 55 112 95 100 124 Z" fill="url(#lotusGoldGrad)" stroke="#e17055" stroke-width="0.5" />

    <!-- Đài sen & hạt vàng lấp lánh (Golden stamens) -->
    <circle cx="100" cy="50" r="2" fill="#ffd700" />
    <circle cx="95" cy="58" r="1.5" fill="#ffd700" />
    <circle cx="105" cy="58" r="1.5" fill="#ffd700" />
    <circle cx="92" cy="68" r="1.5" fill="#ffd700" />
    <circle cx="108" cy="68" r="1.5" fill="#ffd700" />
    <circle cx="100" cy="74" r="2" fill="#ffd700" />
  </g>
</svg>
